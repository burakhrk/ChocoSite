<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Denizli içi aynı gün teslimatlı çikolata, pasta, çiçek ve kutlama hediyeleri."
    />
    <title>ChocoSite | Denizli Çikolata ve Kutlama Hediyeleri</title>
    <script>
      try {
        var known = ['bittersweet', 'pistachio-pop', 'blueberry-truffle', 'turmeric-sky'];
        var fromUrl = new URLSearchParams(location.search).get('palette');
        var palette = fromUrl || localStorage.getItem('chocosite-palette');
        if (known.indexOf(palette) !== -1) document.documentElement.dataset.palette = palette;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
